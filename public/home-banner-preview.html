<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home — Promo Carousel + Paket Deposit</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; background: #f1f5f9; }
    .phone { max-width: 28rem; margin: 0 auto; padding: 16px 16px 40px; }
    .header { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .logo { width: 40px; height: 40px; border-radius: 12px; background: #2563eb; }
    h1 { margin: 0; font-size: 16px; }
    .sub { margin: 2px 0 0; font-size: 10px; color: #2563eb; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
    .carousel { position: relative; height: 150px; border-radius: 24px; overflow: hidden; background: linear-gradient(135deg, #0ea5e9, #2563eb, #4338ca); color: #fff; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; }
    .carousel h2 { margin: 0; font-size: 14px; }
    .carousel p { margin: 4px 0 0; font-size: 11px; opacity: .9; }
    .dots { display: flex; justify-content: center; gap: 6px; margin: 8px 0 16px; }
    .dots span { height: 6px; width: 6px; border-radius: 99px; background: #cbd5e1; }
    .dots .on { width: 20px; background: #2563eb; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 16px; display: flex; gap: 12px; align-items: flex-start; }
    .icon { width: 36px; height: 36px; border-radius: 999px; flex-shrink: 0; }
    .blue { background: #eff6ff; }
    .indigo { background: #eef2ff; }
    .title { font-size: 12px; font-weight: 800; }
    .hint { font-size: 10px; color: #64748b; }
    .saldo { font-size: 10px; color: #4f46e5; font-weight: 700; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <div class="logo"></div>
      <div>
        <h1>Laundrivery</h1>
        <p class="sub">Express Laundry Delivery</p>
      </div>
    </div>
    <div class="carousel">
      <h2>Promo & Voucher Laundrivery</h2>
      <p>Ketuk banner untuk klaim promo aktif</p>
    </div>
    <div class="dots"><span class="on"></span><span></span><span></span></div>
    <div class="grid">
      <div class="card">
        <div class="icon blue"></div>
        <div>
          <div class="title">Pesan Express</div>
          <div class="hint">Jemput ke Rumah</div>
        </div>
      </div>
      <div class="card">
        <div class="icon indigo"></div>
        <div>
          <div class="title">Paket Deposit</div>
          <div class="hint">Bonus Saldo Extra</div>
          <div class="saldo">Sisa Saldo: Rp 226.000</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
